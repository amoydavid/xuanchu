# Xuanchu 本机配置示例
# 复制到 ~/.config/xuanchu/xuanchu.toml，或通过 XUANCHU_CONFIG 指定
# 这里的 key 只描述本机启动与展示配置，不是 workspace 业务配置

[security]
# OIDC SSO 配置中 client_secret 的 envelope 加密密钥（AES-256-GCM）。
# 格式：32 字节随机值的 base64 编码。
# 生成方式：openssl rand -base64 32
# 注意：密钥一旦设置后不要更换，否则已加密的 client_secret 将无法解密。
config_secret_key = "replace-with-openssl-rand-base64-32-output"

[database]
# SQLite 本地数据库路径
path = "/absolute/path/to/xuanchu.db"
# PostgreSQL 与 path 互斥，启用后请注释掉上面的 path
# url = "postgres://user:pass@localhost:5432/xuanchu?sslmode=disable"

[display]
color = true
json = false

[date]
format = "rfc3339"

[remote]
# 远程 CLI / API 服务端地址
server = "http://127.0.0.1:8080"
# 建议优先用环境变量 XUANCHU_TOKEN 注入；如果写进文件，务必把文件权限收紧到 0600
token = "replace-with-your-token"

[server]
# Web Console 对外可达的 HTTP(S) origin。只填写协议、域名和可选端口，不填写路径。
# 资源响应会把它与 server.console.base_path 组合成绝对 url；留空时 url 返回空字符串。
public_base_url = "https://xuanchu.example.com"

[server.admin]
enabled = false

[server.shutdown]
# 收到 SIGTERM / SIGINT 后等待已开始工作完成的整体 drain 时间。
timeout = "30s"
# drain 超时后发出强制取消，再等待运行时清理资源的时间。
force_timeout = "5s"

[notifications.dispatcher]
# dispatcher 级并发。默认 1，保持顺序投递；需要吞吐时再显式调大。
max_concurrency = 1
# 每轮最多从数据库领取多少条。它是查询上限，不是并发数。
batch_size = 50
prefetch_factor = 1
poll_interval = "5s"
claim_ttl = "5m"

[hooks.dispatcher]
max_concurrency = 1
batch_size = 50
prefetch_factor = 1
poll_interval = "5s"
claim_ttl = "5m"

# Server admin token 只用于 /api/v1/admin/* bootstrap 控制面。
# 生产建议使用 hash 或 hash_env，不要保存明文 token。
# 生成方式：
#   xuanchu admin token generate

[[server.admin.tokens]]
name = "ops-primary"
hash = "sha256:replace-with-token-hash"
enabled = false
description = "server bootstrap token"

[[server.admin.tokens]]
name = "ops-rotation"
hash_env = "XUANCHU_ADMIN_TOKEN_HASH"
enabled = false
description = "rotation token hash from deployment secret"

[log]
level = "info"
format = "text"

[log.file]
path = "/absolute/path/to/xuanchu.log"
rotate = true
max_size_mb = 20
max_age_days = 14

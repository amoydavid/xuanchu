openapi: 3.0.3
info:
  title: Xuanchu HTTP API
  version: v1
servers:
  - url: http://127.0.0.1:8080
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: xuanchu_pat or xuanchu_agent
    serverAdminAuth:
      type: http
      scheme: bearer
      bearerFormat: xuanchu_admin
  schemas:
    ErrorCode:
      type: string
      enum:
        - auth_missing_token
        - auth_invalid_token
        - auth_token_expired
        - auth_token_revoked
        - admin_auth_required
        - admin_auth_invalid
        - admin_token_ttl_invalid
        - token_name_required
        - token_scope_invalid
        - token_project_scope_invalid
        - token_scope_denied
        - workspace_scope_denied
        - project_scope_denied
        - membership_not_found
        - permission_denied
        - task_not_found
        - task_ref_invalid
        - task_uuid_invalid
        - assignee_not_found
        - assignee_not_member
        - admin_workspace_exists
        - admin_owner_required
        - admin_owner_invalid
        - workspace_required
        - workspace_not_found
        - workspace_archived
        - project_not_found
        - project_mismatch
        - context_not_found
        - config_not_found
        - config_definition_not_found
        - config_scope_not_allowed
        - config_definition_in_use
        - config_value_invalid
        - config_value_too_large
        - project_config_scope_required
        - route_not_found
        - method_not_allowed
        - api_bad_json
        - api_bad_limit
        - api_payload_too_large
        - api_internal
        - token_not_found
        - hook_not_found
        - hook_event_types_invalid
        - hook_sink_required
        - hook_url_not_supported
        - hook_scope_invalid
        - hook_delivery_not_found
        - hook_delivery_not_replayable
        - notification_sink_invalid
        - notification_sink_not_found
        - notification_rule_invalid
        - notification_rule_not_found
        - notification_rule_url_not_supported
        - reminder_rule_invalid
        - reminder_rule_not_found
        - recipient_not_found
        - recipient_not_member
        - audience_unsupported_for_event
        - remote_server_invalid
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    Task:
      type: object
      additionalProperties: true
      properties:
        uuid:
          type: string
        task_slug:
          type: string
          nullable: true
        description:
          type: string
        project:
          type: string
          nullable: true
        project_id:
          type: string
          nullable: true
        status:
          type: string
        assignees:
          type: array
          items:
            $ref: '#/components/schemas/TaskAssignee'
    TaskAssignee:
      type: object
      properties:
        user_id:
          type: string
        name:
          type: string
        email:
          type: string
          nullable: true
    Project:
      type: object
      required: [id, workspace_id, slug, name, status]
      properties:
        id:
          type: string
        workspace_id:
          type: string
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
        task_count:
          type: integer
        created_at:
          type: integer
          format: int64
        modified_at:
          type: integer
          format: int64
        archived_at:
          type: integer
          format: int64
          nullable: true
    Workspace:
      type: object
      required: [id, slug, name, visibility, role, active, created_at, modified_at]
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        visibility:
          type: string
        created_by_user_id:
          type: string
          nullable: true
        archived_at:
          type: integer
          format: int64
          nullable: true
        role:
          type: string
          enum: [owner, admin, member, viewer]
        active:
          type: boolean
        created_at:
          type: integer
          format: int64
        modified_at:
          type: integer
          format: int64
    Member:
      type: object
      required: [user_id, name, role, joined_at, modified_at]
      properties:
        user_id:
          type: string
        name:
          type: string
        email:
          type: string
          nullable: true
        role:
          type: string
          enum: [owner, admin, member, viewer]
        joined_at:
          type: integer
          format: int64
        modified_at:
          type: integer
          format: int64
    User:
      type: object
      required: [id, name, active, created_at, modified_at]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          nullable: true
        default_workspace_id:
          type: string
          nullable: true
        active:
          type: boolean
        created_at:
          type: integer
          format: int64
        modified_at:
          type: integer
          format: int64
    Token:
      type: object
      properties:
        id:
          type: string
        prefix:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [pat, agent]
        user_id:
          type: string
        workspace_ids:
          type: array
          items:
            type: string
        project_ids:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: string
        created_at:
          type: integer
          format: int64
        expires_at:
          type: integer
          format: int64
          nullable: true
        revoked_at:
          type: integer
          format: int64
          nullable: true
        last_used_at:
          type: integer
          format: int64
          nullable: true
    Context:
      type: object
      properties:
        name:
          type: string
        filter:
          type: string
        active:
          type: boolean
        created_at:
          type: integer
          format: int64
        modified_at:
          type: integer
          format: int64
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          format: int64
        actor_user_id:
          type: string
          nullable: true
        actor_name:
          type: string
        workspace_id:
          type: string
          nullable: true
        project_id:
          type: string
          nullable: true
        action:
          type: string
        target_type:
          type: string
        target_id:
          type: string
        payload:
          type: object
          additionalProperties: true
        delegator_token_id:
          type: string
          nullable: true
        delegator_user_id:
          type: string
          nullable: true
        created_at:
          type: integer
          format: int64
    Success:
      type: object
      required: [data]
      properties:
        data:
          nullable: true
    Hook:
      type: object
      required: [id, workspace_id, name, sink_id, sink_name, sink_type, event_types, scope_type, enabled, timeout_seconds, max_attempts, created_at, modified_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
          nullable: true
          description: Non-null when hook is scoped to a project.
        name:
          type: string
        sink_id:
          type: string
          format: uuid
          description: Workspace-scoped outbound sink UUID.
        sink_name:
          type: string
        sink_type:
          type: string
          enum: [webhook, http_template]
        event_types:
          type: array
          items:
            type: string
            enum:
              - task.created
              - task.modified
              - task.completed
              - task.deleted
              - project.archived
              - project.annotated
              - project.denotated
              - task.unblocked
        scope_type:
          type: string
          enum: [workspace, project]
        enabled:
          type: boolean
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 120
        max_attempts:
          type: integer
          minimum: 1
          maximum: 20
        created_at:
          type: integer
          format: int64
        modified_at:
          type: integer
          format: int64
    HookCreateRequest:
      type: object
      required: [name, sink, event_types]
      properties:
        name:
          type: string
        sink:
          type: string
          description: Sink name or UUID in the effective workspace.
        event_types:
          type: array
          items:
            type: string
            enum:
              - task.created
              - task.modified
              - task.completed
              - task.deleted
              - project.archived
              - project.annotated
              - project.denotated
              - task.unblocked
          minItems: 1
        scope_type:
          type: string
          enum: [workspace, project]
          default: workspace
        project_ref:
          type: string
          nullable: true
          description: Project slug or UUID. Required when scope_type is project.
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 120
        max_attempts:
          type: integer
          minimum: 1
          maximum: 20
    HookUpdateRequest:
      type: object
      properties:
        name:
          type: string
        sink:
          type: string
          description: Sink name or UUID in the effective workspace.
        event_types:
          type: array
          items:
            type: string
            enum:
              - task.created
              - task.modified
              - task.completed
              - task.deleted
              - project.archived
              - project.annotated
              - project.denotated
              - task.unblocked
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 120
        max_attempts:
          type: integer
          minimum: 1
          maximum: 20
    HookDelivery:
      type: object
      required: [id, hook_id, event_id, event_type, workspace_id, status, attempt_count, created_at, modified_at]
      properties:
        id:
          type: string
          format: uuid
        hook_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        event_type:
          type: string
        workspace_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
          nullable: true
        actor_user_id:
          type: string
          format: uuid
        headers:
          type: object
          additionalProperties:
            type: string
        payload:
          type: object
          additionalProperties: true
          nullable: true
          description: Event payload as JSON object.
        status:
          type: string
          enum:
            - queued
            - delivering
            - succeeded
            - retry_wait
            - dead_lettered
            - disabled_skipped
        attempt_count:
          type: integer
          minimum: 0
        next_attempt_at:
          type: integer
          format: int64
          nullable: true
        claim_expires_at:
          type: integer
          format: int64
          nullable: true
        last_attempt_at:
          type: integer
          format: int64
          nullable: true
        last_status_code:
          type: integer
          nullable: true
        last_error:
          type: string
          nullable: true
        created_at:
          type: integer
          format: int64
        modified_at:
          type: integer
          format: int64
    HookDeliveryReplayResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/HookDelivery'
    HTTPHeaderTemplate:
      type: object
      required: [name, value]
      properties:
        name:
          type: string
        value:
          type: string
    HTTPTemplateSecretRef:
      type: object
      required: [alias, config_key]
      properties:
        alias:
          type: string
        config_key:
          type: string
    NotificationSink:
      type: object
      required: [id, workspace_id, name, type, endpoint_mode, enabled, timeout_seconds, max_attempts, created_by, created_at, modified_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [webhook, http_template]
        endpoint_mode:
          type: string
          enum: [static_url, template, config_value]
        url:
          type: string
        url_template:
          type: string
        config_key:
          type: string
        allowed_hosts:
          type: array
          items:
            type: string
        http_method:
          type: string
          enum: [POST]
        header_templates:
          type: array
          items:
            $ref: '#/components/schemas/HTTPHeaderTemplate'
        body_template:
          type: string
        body_content_type:
          type: string
        secret_refs:
          type: array
          items:
            $ref: '#/components/schemas/HTTPTemplateSecretRef'
        enabled:
          type: boolean
        timeout_seconds:
          type: integer
        max_attempts:
          type: integer
        created_by:
          type: object
          additionalProperties: true
        created_at:
          type: integer
          format: int64
        modified_at:
          type: integer
          format: int64
    NotificationSinkRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [webhook, http_template]
        endpoint_mode:
          type: string
          enum: [static_url, template, config_value]
        url:
          type: string
        url_template:
          type: string
        config_key:
          type: string
        allowed_hosts:
          type: array
          items:
            type: string
        header_templates:
          type: array
          items:
            $ref: '#/components/schemas/HTTPHeaderTemplate'
        body_template:
          type: string
        body_content_type:
          type: string
        secret_refs:
          type: array
          items:
            $ref: '#/components/schemas/HTTPTemplateSecretRef'
        secret:
          type: string
          description: Optional webhook signing secret. Never returned in responses.
        timeout_seconds:
          type: integer
        max_attempts:
          type: integer
    NotificationSinkUpdateRequest:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [webhook, http_template]
        endpoint_mode:
          type: string
          enum: [static_url, template, config_value]
        url:
          type: string
        url_template:
          type: string
        config_key:
          type: string
        allowed_hosts:
          type: array
          items:
            type: string
        header_templates:
          type: array
          items:
            $ref: '#/components/schemas/HTTPHeaderTemplate'
        body_template:
          type: string
        body_content_type:
          type: string
        secret_refs:
          type: array
          items:
            $ref: '#/components/schemas/HTTPTemplateSecretRef'
        secret:
          type: string
          description: Replace webhook signing secret. Never returned in responses.
        timeout_seconds:
          type: integer
        max_attempts:
          type: integer
    ReminderRule:
      type: object
      required: [id, workspace_id, name, enabled, trigger_type, repeat_policy, schedule_type, schedule_value, filter_source, audience_type, recipient_users, sink_id, created_by, created_at, modified_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        enabled:
          type: boolean
        trigger_type:
          type: string
        offset_seconds:
          type: integer
          format: int64
        after_seconds:
          type: integer
          format: int64
        repeat_policy:
          type: string
        schedule_type:
          type: string
        schedule_value:
          type: string
        filter_source:
          type: string
        audience_type:
          type: string
          enum: [assignees, explicit_users, assignees_and_explicit_users]
        recipient_users:
          type: array
          items:
            type: object
            additionalProperties: true
        sink_id:
          type: string
          format: uuid
        created_by:
          type: object
          additionalProperties: true
        created_at:
          type: integer
          format: int64
        modified_at:
          type: integer
          format: int64
    ReminderRuleRequest:
      type: object
      required: [name, audience_type, sink_ref]
      properties:
        name:
          type: string
        project_ref:
          type: string
        trigger_type:
          type: string
          enum: [due_before, overdue]
        offset_seconds:
          type: integer
          format: int64
        after_seconds:
          type: integer
          format: int64
        repeat_policy:
          type: string
        schedule_type:
          type: string
        schedule_value:
          type: string
        filter_source:
          type: string
        audience_type:
          type: string
          enum: [assignees, explicit_users, assignees_and_explicit_users]
        recipients:
          type: array
          items:
            type: string
        sink_ref:
          type: string
          description: Sink name or UUID in the effective workspace.
    ReminderRuleUpdateRequest:
      type: object
      properties:
        name:
          type: string
        project_ref:
          type: string
          description: Empty string clears project scope.
        trigger_type:
          type: string
          enum: [due_before, overdue]
        offset_seconds:
          type: integer
          format: int64
        after_seconds:
          type: integer
          format: int64
        repeat_policy:
          type: string
        schedule_type:
          type: string
        schedule_value:
          type: string
        filter_source:
          type: string
        audience_type:
          type: string
          enum: [assignees, explicit_users, assignees_and_explicit_users]
        recipients:
          type: array
          items:
            type: string
        sink_ref:
          type: string
          description: Sink name or UUID in the effective workspace.
    NotificationRule:
      type: object
      required: [id, workspace_id, name, enabled, event_type, filter_source, audience_type, recipient_users, sink_id, template_subject, template_body, created_by, created_at, modified_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        enabled:
          type: boolean
        event_type:
          type: string
          enum: [task.created, task.modified, task.completed, task.deleted, project.archived, project.annotated, project.denotated, task.unblocked]
        filter_source:
          type: string
        audience_type:
          type: string
          enum: [actor, assignees, explicit_users, assignees_and_explicit_users]
        recipient_users:
          type: array
          items:
            type: object
            additionalProperties: true
        sink_id:
          type: string
          format: uuid
        template_subject:
          type: string
        template_body:
          type: string
        created_by:
          type: object
          additionalProperties: true
        created_at:
          type: integer
          format: int64
        modified_at:
          type: integer
          format: int64
    NotificationRuleRequest:
      type: object
      required: [name, event_type, audience_type, sink]
      properties:
        name:
          type: string
        project_ref:
          type: string
        event_type:
          type: string
          enum: [task.created, task.modified, task.completed, task.deleted, project.archived, project.annotated, project.denotated, task.unblocked]
        filter_source:
          type: string
        audience_type:
          type: string
          enum: [actor, assignees, explicit_users, assignees_and_explicit_users]
        recipients:
          type: array
          items:
            type: string
        sink:
          type: string
          description: Sink name or UUID in the effective workspace. URL is rejected.
        template_subject:
          type: string
        template_body:
          type: string
    NotificationRuleUpdateRequest:
      type: object
      properties:
        name:
          type: string
        project_ref:
          type: string
          description: Empty string clears project scope.
        event_type:
          type: string
          enum: [task.created, task.modified, task.completed, task.deleted, project.archived, project.annotated, project.denotated, task.unblocked]
        filter_source:
          type: string
        audience_type:
          type: string
          enum: [actor, assignees, explicit_users, assignees_and_explicit_users]
        recipients:
          type: array
          items:
            type: string
        sink:
          type: string
          description: Sink name or UUID in the effective workspace. URL is rejected.
        template_subject:
          type: string
        template_body:
          type: string
    NotificationDelivery:
      type: object
      required: [id, workspace_id, rule_id, sink_id, object_kind, object_id, recipient, event_id, event_type, resolved_url, rendered_method, rendered_headers, rendered_body, rendered_content_type, payload, status, attempt_count, created_at, modified_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
          nullable: true
        rule_id:
          type: string
          format: uuid
        sink_id:
          type: string
          format: uuid
        task_uuid:
          type: string
          nullable: true
        object_kind:
          type: string
          description: Event object kind, for example task or project.
        object_id:
          type: string
          description: Event object ID.
        recipient:
          type: object
          additionalProperties: true
        event_id:
          type: string
        event_type:
          type: string
        resolved_url:
          type: string
        resolved_endpoint_source:
          type: string
        resolved_endpoint_fingerprint:
          type: string
        rendered_method:
          type: string
        rendered_headers:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        rendered_body:
          type: string
        rendered_content_type:
          type: string
        payload:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [queued, delivering, succeeded, retry_wait, dead_lettered, disabled_skipped]
        attempt_count:
          type: integer
        next_attempt_at:
          type: integer
          format: int64
          nullable: true
        claim_expires_at:
          type: integer
          format: int64
          nullable: true
        last_attempt_at:
          type: integer
          format: int64
          nullable: true
        last_status_code:
          type: integer
          nullable: true
        last_error:
          type: string
          nullable: true
        created_at:
          type: integer
          format: int64
        modified_at:
          type: integer
          format: int64
  parameters:
    WorkspaceQuery:
      in: query
      name: workspace
      schema:
        type: string
      description: Workspace slug or UUID. If omitted, token/default workspace rules apply.
    ProjectQuery:
      in: query
      name: project
      schema:
        type: string
      description: Project slug or UUID in the effective workspace.
    ProjectIDQuery:
      in: query
      name: project_id
      schema:
        type: string
      description: Stable project UUID. If project is also provided, both must resolve to the same project.
    ImpersonateHeader:
      in: header
      name: X-Xuanchu-As
      schema:
        type: string
      description: Impersonation target user name, email, or UUID. Requires agent token with impersonate scope.
  responses:
    Unauthorized:
      description: Missing, invalid, expired, or revoked bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Token scope, workspace/project scope, membership, or role permission denied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BadRequest:
      description: Invalid JSON, invalid path parameter, or validation failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Route or resource not found. Project-scoped task misses use task_not_found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Resource already exists or conflicts with current state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PayloadTooLarge:
      description: Request body exceeds server limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
paths:
  /healthz:
    get:
      security: []
      summary: Health check.
      responses:
        '200':
          description: Server is healthy.
  /api/v1/admin/workspaces:
    post:
      summary: Create workspace via server admin bootstrap token.
      description: Uses a server admin token from `[server.admin]`, not a PAT or Agent token. The admin token cannot access ordinary API endpoints.
      security:
        - serverAdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, owner]
              properties:
                slug:
                  type: string
                name:
                  type: string
                description:
                  type: string
                visibility:
                  type: string
                  enum: [private, team, public]
                owner:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                    email:
                      type: string
      responses:
        '201':
          description: Workspace created.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/workspaces/{workspace}/agent-tokens:
    post:
      summary: Create workspace-scoped agent token via server admin bootstrap token.
      description: The raw agent token is returned once. Server admin token hash/verifier is never returned.
      security:
        - serverAdminAuth: []
      parameters:
        - in: path
          name: workspace
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name:
                  type: string
                user:
                  type: string
                  description: User ref. Defaults to the workspace owner when omitted.
                scopes:
                  type: array
                  items:
                    type: string
                project_refs:
                  type: array
                  items:
                    type: string
                project_ids:
                  type: array
                  items:
                    type: string
                expires_in:
                  type: string
                  description: Go time.ParseDuration expression, for example 24h.
                expires_in_seconds:
                  type: integer
                  format: int64
      responses:
        '201':
          description: Agent token created.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/me:
    get:
      summary: Current actor, token, visible workspaces, and effective workspace.
      responses:
        '200':
          description: Actor metadata.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/tasks:
    get:
      summary: List tasks or run a report in the effective workspace.
      parameters:
        - $ref: '#/components/parameters/WorkspaceQuery'
        - $ref: '#/components/parameters/ProjectQuery'
        - $ref: '#/components/parameters/ProjectIDQuery'
        - in: query
          name: report
          schema:
            type: string
        - in: query
          name: target
          schema:
            type: string
        - in: query
          name: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: Taskwarrior-style filter expression. Alias of filter. Supports assignee filters such as assignee:alice and assignee:me.
        - in: query
          name: filter
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - in: query
          name: sort
          schema:
            type: string
        - in: query
          name: no_context
          schema:
            type: boolean
          description: Bypass the server-side active context for this request.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
          description: Maximum number of tasks to return. Defaults to 200.
      responses:
        '200':
          description: Task list.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create a task.
      parameters:
        - $ref: '#/components/parameters/WorkspaceQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description:
                  type: string
                project:
                  type: string
                project_id:
                  type: string
                priority:
                  type: string
                due:
                  type: integer
                  format: int64
                assignees:
                  type: array
                  items:
                    type: string
                depends:
                  type: array
                  items:
                    type: string
                wait:
                  type: integer
                  format: int64
                scheduled:
                  type: integer
                  format: int64
                until:
                  type: integer
                  format: int64
                recur:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
                udas:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        '201':
          description: Task created.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/tasks/{taskRef}:
    parameters:
      - in: path
        name: taskRef
        required: true
        description: Task UUID or task_slug. Numeric working-set IDs are rejected with task_ref_invalid.
        schema:
          type: string
      - $ref: '#/components/parameters/WorkspaceQuery'
    get:
      summary: Get one task by UUID or task_slug. Numeric working-set IDs are rejected with task_ref_invalid.
      responses:
        '200':
          description: Task details.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Modify one task by UUID or task_slug.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                project:
                  type: string
                project_id:
                  type: string
                priority:
                  type: string
                clear_project:
                  type: boolean
                clear_priority:
                  type: boolean
                due:
                  type: integer
                  format: int64
                clear_due:
                  type: boolean
                wait:
                  type: integer
                  format: int64
                clear_wait:
                  type: boolean
                scheduled:
                  type: integer
                  format: int64
                clear_scheduled:
                  type: boolean
                until:
                  type: integer
                  format: int64
                clear_until:
                  type: boolean
                assignees:
                  type: array
                  items:
                    type: string
                remove_assignees:
                  type: array
                  items:
                    type: string
                clear_assignees:
                  type: boolean
                depends:
                  type: array
                  items:
                    type: string
                clear_depends:
                  type: boolean
                recur:
                  type: string
                clear_recur:
                  type: boolean
                tags:
                  type: array
                  items:
                    type: string
                remove_tags:
                  type: array
                  items:
                    type: string
                udas:
                  type: object
                  additionalProperties:
                    type: string
                clear_udas:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Modified task.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Mark a task deleted.
      responses:
        '200':
          description: Deleted task.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/tasks/{taskRef}/done:
    post:
      summary: Complete a task by UUID or task_slug.
      parameters:
        - in: path

openapi: 3.0.3
info:
  title: xuanchu HTTP API
  version: v1
servers:
  - url: http://127.0.0.1:8080
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: xuanchu_pat or xuanchu_agent
  schemas:
    ErrorCode:
      type: string
      enum:
        - auth_missing_token
        - auth_invalid_token
        - auth_token_expired
        - auth_token_revoked
        - token_scope_denied
        - workspace_scope_denied
        - project_scope_denied
        - membership_not_found
        - permission_denied
        - task_not_found
        - task_uuid_invalid
        - assignee_not_found
        - assignee_not_member
        - workspace_required
        - project_not_found
        - project_mismatch
        - context_not_found
        - config_not_found
        - config_key_unsupported
        - route_not_found
        - method_not_allowed
        - api_bad_json
        - api_bad_limit
        - api_payload_too_large
        - api_internal
        - token_not_found
        - hook_not_found
        - hook_event_types_invalid
        - hook_endpoint_invalid
        - hook_scope_invalid
        - hook_secret_invalid
        - hook_delivery_not_found
        - hook_delivery_not_replayable
        - remote_server_invalid
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    Task:
      type: object
      additionalProperties: true
      properties:
        uuid:
          type: string
        description:
          type: string
        project:
          type: string
          nullable: true
        project_id:
          type: string
          nullable: true
        status:
          type: string
        assignees:
          type: array
          items:
            $ref: '#/components/schemas/TaskAssignee'
    TaskAssignee:
      type: object
      properties:
        user_id:
          type: string
        name:
          type: string
        email:
          type: string
          nullable: true
    Project:
      type: object
      required: [id, workspace_id, slug, name, status]
      properties:
        id:
          type: string
        workspace_id:
          type: string
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
        task_count:
          type: integer
        created_at:
          type: integer
          format: int64
        modified_at:
          type: integer
          format: int64
        archived_at:
          type: integer
          format: int64
          nullable: true
    Workspace:
      type: object
      required: [id, slug, name, visibility, role, active, created_at, modified_at]
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        visibility:
          type: string
        created_by_user_id:
          type: string
          nullable: true
        archived_at:
          type: integer
          format: int64
          nullable: true
        role:
          type: string
          enum: [owner, admin, member, viewer]
        active:
          type: boolean
        created_at:
          type: integer
          format: int64
        modified_at:
          type: integer
          format: int64
    Member:
      type: object
      required: [user_id, name, role, joined_at, modified_at]
      properties:
        user_id:
          type: string
        name:
          type: string
        email:
          type: string
          nullable: true
        role:
          type: string
          enum: [owner, admin, member, viewer]
        joined_at:
          type: integer
          format: int64
        modified_at:
          type: integer
          format: int64
    User:
      type: object
      required: [id, name, active, created_at, modified_at]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          nullable: true
        default_workspace_id:
          type: string
          nullable: true
        active:
          type: boolean
        created_at:
          type: integer
          format: int64
        modified_at:
          type: integer
          format: int64
    Token:
      type: object
      properties:
        id:
          type: string
        prefix:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [pat, agent]
        user_id:
          type: string
        workspace_ids:
          type: array
          items:
            type: string
        project_ids:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: string
        created_at:
          type: integer
          format: int64
        expires_at:
          type: integer
          format: int64
          nullable: true
        revoked_at:
          type: integer
          format: int64
          nullable: true
        last_used_at:
          type: integer
          format: int64
          nullable: true
    Context:
      type: object
      properties:
        name:
          type: string
        filter:
          type: string
        active:
          type: boolean
        created_at:
          type: integer
          format: int64
        modified_at:
          type: integer
          format: int64
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          format: int64
        actor_user_id:
          type: string
          nullable: true
        actor_name:
          type: string
        workspace_id:
          type: string
          nullable: true
        project_id:
          type: string
          nullable: true
        action:
          type: string
        target_type:
          type: string
        target_id:
          type: string
        payload:
          type: object
          additionalProperties: true
        delegator_token_id:
          type: string
          nullable: true
        delegator_user_id:
          type: string
          nullable: true
        created_at:
          type: integer
          format: int64
    Success:
      type: object
      required: [data]
      properties:
        data:
          nullable: true
    Hook:
      type: object
      required: [id, workspace_id, name, endpoint_url, event_types, scope_type, enabled, timeout_seconds, max_attempts, created_at, modified_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
          nullable: true
          description: Non-null when hook is scoped to a project.
        name:
          type: string
        endpoint_url:
          type: string
          format: uri
        event_types:
          type: array
          items:
            type: string
            enum:
              - task.created
              - task.modified
              - task.completed
              - task.deleted
              - project.archived
        scope_type:
          type: string
          enum: [workspace, project]
        enabled:
          type: boolean
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 120
        max_attempts:
          type: integer
          minimum: 1
          maximum: 20
        created_at:
          type: integer
          format: int64
        modified_at:
          type: integer
          format: int64
    HookCreateRequest:
      type: object
      required: [name, endpoint_url, event_types]
      properties:
        name:
          type: string
        endpoint_url:
          type: string
          format: uri
        event_types:
          type: array
          items:
            type: string
            enum:
              - task.created
              - task.modified
              - task.completed
              - task.deleted
              - project.archived
          minItems: 1
        scope_type:
          type: string
          enum: [workspace, project]
          default: workspace
        project_ref:
          type: string
          nullable: true
          description: Project slug or UUID. Required when scope_type is project.
        secret:
          type: string
          nullable: true
          description: Optional HMAC-SHA256 signing secret. Never returned in responses.
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 120
        max_attempts:
          type: integer
          minimum: 1
          maximum: 20
    HookUpdateRequest:
      type: object
      properties:
        name:
          type: string
        endpoint_url:
          type: string
          format: uri
        event_types:
          type: array
          items:
            type: string
            enum:
              - task.created
              - task.modified
              - task.completed
              - task.deleted
              - project.archived
        secret:
          type: string
          nullable: true
          description: Replace the signing secret. Pass null or omit to keep existing.
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 120
        max_attempts:
          type: integer
          minimum: 1
          maximum: 20
    HookDelivery:
      type: object
      required: [id, hook_id, event_id, event_type, workspace_id, status, attempt_count, created_at, modified_at]
      properties:
        id:
          type: string
          format: uuid
        hook_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        event_type:
          type: string
        workspace_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
          nullable: true
        actor_user_id:
          type: string
          format: uuid
        headers:
          type: object
          additionalProperties:
            type: string
        payload:
          type: object
          additionalProperties: true
          nullable: true
          description: Event payload as JSON object.
        status:
          type: string
          enum:
            - queued
            - delivering
            - succeeded
            - retry_wait
            - dead_lettered
            - disabled_skipped
        attempt_count:
          type: integer
          minimum: 0
        next_attempt_at:
          type: integer
          format: int64
          nullable: true
        claim_expires_at:
          type: integer
          format: int64
          nullable: true
        last_attempt_at:
          type: integer
          format: int64
          nullable: true
        last_status_code:
          type: integer
          nullable: true
        last_error:
          type: string
          nullable: true
        created_at:
          type: integer
          format: int64
        modified_at:
          type: integer
          format: int64
    HookDeliveryReplayResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/HookDelivery'
  parameters:
    WorkspaceQuery:
      in: query
      name: workspace
      schema:
        type: string
      description: Workspace slug or UUID. If omitted, token/default workspace rules apply.
    ProjectQuery:
      in: query
      name: project
      schema:
        type: string
      description: Project slug or UUID in the effective workspace.
    ProjectIDQuery:
      in: query
      name: project_id
      schema:
        type: string
      description: Stable project UUID. If project is also provided, both must resolve to the same project.
    ImpersonateHeader:
      in: header
      name: X-Xuanchu-As
      schema:
        type: string
      description: Impersonation target user name, email, or UUID. Requires agent token with impersonate scope.
  responses:
    Unauthorized:
      description: Missing, invalid, expired, or revoked bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Token scope, workspace/project scope, membership, or role permission denied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BadRequest:
      description: Invalid JSON, invalid path parameter, or validation failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Route or resource not found. Project-scoped task misses use task_not_found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PayloadTooLarge:
      description: Request body exceeds server limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
paths:
  /healthz:
    get:
      security: []
      summary: Health check.
      responses:
        '200':
          description: Server is healthy.
  /api/v1/me:
    get:
      summary: Current actor, token, visible workspaces, and effective workspace.
      responses:
        '200':
          description: Actor metadata.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/tasks:
    get:
      summary: List tasks or run a report in the effective workspace.
      parameters:
        - $ref: '#/components/parameters/WorkspaceQuery'
        - $ref: '#/components/parameters/ProjectQuery'
        - $ref: '#/components/parameters/ProjectIDQuery'
        - in: query
          name: report
          schema:
            type: string
        - in: query
          name: target
          schema:
            type: string
        - in: query
          name: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: Taskwarrior-style filter expression. Alias of filter. Supports assignee filters such as assignee:alice and assignee:me.
        - in: query
          name: filter
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - in: query
          name: sort
          schema:
            type: string
        - in: query
          name: no_context
          schema:
            type: boolean
          description: Bypass the server-side active context for this request.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
          description: Maximum number of tasks to return. Defaults to 200.
      responses:
        '200':
          description: Task list.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create a task.
      parameters:
        - $ref: '#/components/parameters/WorkspaceQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description:
                  type: string
                project:
                  type: string
                project_id:
                  type: string
                priority:
                  type: string
                due:
                  type: integer
                  format: int64
                assignees:
                  type: array
                  items:
                    type: string
                depends:
                  type: array
                  items:
                    type: string
                wait:
                  type: integer
                  format: int64
                scheduled:
                  type: integer
                  format: int64
                until:
                  type: integer
                  format: int64
                recur:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
                udas:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        '201':
          description: Task created.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/tasks/{uuid}:
    parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/WorkspaceQuery'
    get:
      summary: Get one task by full UUID. Numeric working-set IDs are rejected with task_uuid_invalid.
      responses:
        '200':
          description: Task details.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Modify one task by full UUID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                project:
                  type: string
                project_id:
                  type: string
                priority:
                  type: string
                clear_project:
                  type: boolean
                clear_priority:
                  type: boolean
                due:
                  type: integer
                  format: int64
                clear_due:
                  type: boolean
                wait:
                  type: integer
                  format: int64
                clear_wait:
                  type: boolean
                scheduled:
                  type: integer
                  format: int64
                clear_scheduled:
                  type: boolean
                until:
                  type: integer
                  format: int64
                clear_until:
                  type: boolean
                assignees:
                  type: array
                  items:
                    type: string
                remove_assignees:
                  type: array
                  items:
                    type: string
                clear_assignees:
                  type: boolean
                depends:
                  type: array
                  items:
                    type: string
                clear_depends:
                  type: boolean
                recur:
                  type: string
                clear_recur:
                  type: boolean
                tags:
                  type: array
                  items:
                    type: string
                remove_tags:
                  type: array
                  items:
                    type: string
                udas:
                  type: object
                  additionalProperties:
                    type: string
                clear_udas:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Modified task.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Mark a task deleted.
      responses:
        '200':
          description: Deleted task.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/tasks/{uuid}/done:
    post:
      summary: Complete a task.
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/WorkspaceQuery'
      responses:
        '200':
          description: Completed task.
  /api/v1/tasks/{uuid}/start:
    post:
      summary: Start a task.
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/WorkspaceQuery'
      responses:
        '200':
          description: Started task.
  /api/v1/tasks/{uuid}/stop:
    post:
      summary: Stop a task.
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/WorkspaceQuery'
      responses:
        '200':
          description: Stopped task.
  /api/v1/tasks/{uuid}/annotations:
    post:
      summary: Add an annotation.
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/WorkspaceQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Annotated task.
  /api/v1/tasks/{uuid}/annotations/{index}:
    delete:
      summary: Remove an annotation by 1-based index.
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: index
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/WorkspaceQuery'
      responses:
        '200':
          description: Annotation removed.
  /api/v1/tasks/{uuid}/urgency:
    get:
      summary: Explain task urgency.
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/WorkspaceQuery'
      responses:
        '200':
          description: Urgency explanation.
  /api/v1/reports/{name}:
    get:
      summary: Run a named report.
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/WorkspaceQuery'
        - $ref: '#/components/parameters/ProjectQuery'
        - $ref: '#/components/parameters/ProjectIDQuery'
        - in: query
          name: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - in: query
          name: filter
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        '200':
          description: Report task list.
  /api/v1/users:
    get:
      summary: List users.
      responses:
        '200':
          description: User list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
    post:
      summary: Create a user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                email:
                  type: string
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
  /api/v1/users/{user}:
    parameters:
      - in: path
        name: user
        required: true
        schema:
          type: string
        description: User ID or name.
    get:
      summary: Get user details.
      responses:
        '200':
          description: User details.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
  /api/v1/me/active_workspace:
    put:
      summary: Switch the actor's active workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace]
              properties:
                workspace:
                  type: string
                  description: Workspace slug or UUID.
      responses:
        '200':
          description: Active workspace switched.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Workspace'
  /api/v1/workspaces:
    get:
      summary: List visible workspaces.
      parameters:
        - in: query
          name: all
          schema:
            type: boolean
      responses:
        '200':
          description: Workspace list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Workspace'
    post:
      summary: Create a workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug]
              properties:
                slug:
                  type: string
                name:
                  type: string
                description:
                  type: string
                visibility:
                  type: string
      responses:
        '201':
          description: Workspace created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Workspace'
  /api/v1/workspaces/{workspace}:
    parameters:
      - in: path
        name: workspace
        required: true
        schema:
          type: string
        description: Workspace slug or UUID.
    get:
      summary: Get workspace details.
      responses:
        '200':
          description: Workspace details.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Workspace'
    patch:
      summary: Modify workspace metadata.
      responses:
        '200':
          description: Modified workspace.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Workspace'
  /api/v1/workspaces/{workspace}/archive:
    post:
      summary: Archive a workspace.
      parameters:
        - in: path
          name: workspace
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workspace archived.
  /api/v1/workspaces/{workspace}/members:
    get:
      summary: List workspace members.
      parameters:

# ── Webhook protocol ──────────────────────────────────────────
#
# Outbound webhook requests sent by xuanchu dispatcher:
#
# Headers:
#   X-Xuanchu-Event          - event type, e.g. "task.created"
#   X-Xuanchu-Event-Id       - stable event UUID
#   X-Xuanchu-Event-Version  - "1"
#   X-Xuanchu-Delivery       - delivery UUID
#   X-Xuanchu-Hook-Id        - hook UUID
#   X-Xuanchu-Attempt        - attempt number (1-based)
#   X-Xuanchu-Timestamp      - unix seconds at send time
#   X-Xuanchu-Signature-256  - HMAC-SHA256 signature (if secret configured)
#   User-Agent             - "xuanchu/<version>"
#
# Signature computation (when secret is configured):
#   signing_input = "<delivery_id>.<timestamp>.<body>"
#   signature     = "sha256=" + hex(HMAC-SHA256(secret, signing_input))
#   Consumer should reject requests with timestamps older than 5 minutes.
#
# Delivery statuses:
#   queued          - waiting for first attempt
#   delivering      - in-flight HTTP request
#   succeeded       - endpoint returned 2xx
#   retry_wait      - non-2xx or network error, scheduled for retry
#   dead_lettered   - max retries exceeded
#   disabled_skipped - hook is disabled, delivery skipped

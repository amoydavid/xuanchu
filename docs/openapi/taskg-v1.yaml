openapi: 3.0.3
info:
  title: taskg HTTP API
  version: v1
servers:
  - url: http://127.0.0.1:8080
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: taskg token
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
paths:
  /healthz:
    get:
      summary: Health check
      responses:
        '200':
          description: Server is healthy
  /api/v1/me:
    get:
      summary: Current authenticated actor
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated actor details
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/tasks:
    get:
      summary: List tasks in the effective workspace
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: workspace
          schema:
            type: string
        - in: query
          name: report
          schema:
            type: string
        - in: query
          name: target
          schema:
            type: string
        - in: query
          name: filter
          schema:
            type: string
          description: Repeatable CLI-style filter token
      responses:
        '200':
          description: Task list
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Token scope or membership denied
        '404':
          description: Task or workspace not found
    post:
      summary: Create a task
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description:
                  type: string
                project:
                  type: string
                project_id:
                  type: string
                priority:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Task created
        '400':
          description: Invalid JSON or validation failure
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Token scope or membership denied
  /api/v1/tasks/{taskID}:
    get:
      summary: Get a task by UUID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: taskID
          required: true
          schema:
            type: string
        - in: query
          name: workspace
          schema:
            type: string
      responses:
        '200':
          description: Task details
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Token scope or membership denied
        '404':
          description: Task not found
  /api/v1/projects:
    get:
      summary: List projects in the effective workspace
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: workspace
          schema:
            type: string
        - in: query
          name: all
          schema:
            type: boolean
      responses:
        '200':
          description: Project list
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Token scope or membership denied
    post:
      summary: Create a project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name]
              properties:
                slug:
                  type: string
                name:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Project created
        '400':
          description: Invalid JSON or validation failure
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Token scope or membership denied
  /api/v1/projects/{projectRef}:
    get:
      summary: Get a project by slug or UUID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: projectRef
          required: true
          schema:
            type: string
        - in: query
          name: workspace
          schema:
            type: string
      responses:
        '200':
          description: Project details
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Token scope or membership denied
        '404':
          description: Project not found
  /api/v1/tokens:
    get:
      summary: List visible tokens for the current actor
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: workspace
          schema:
            type: string
        - in: query
          name: all
          schema:
            type: boolean
      responses:
        '200':
          description: Token list
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Token scope or membership denied

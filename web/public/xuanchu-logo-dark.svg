<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64">
  <style>
    .xc-top { fill: #10b981; }
    .xc-left { fill: #059669; }
    .xc-right { fill: #047857; }
    .xc-accent { fill: #a7f3d0; }
    @media (prefers-color-scheme: dark) {
      .xc-top { fill: #34d399; }
      .xc-left { fill: #065f46; }
      .xc-right { fill: #022c22; }
      .xc-accent { fill: #ecfdf5; }
    }
  </style>
  <!-- 右侧面基石 -->
  <path class="xc-right" d="M50 55 L90 35 L90 70 L50 90 Z"></path>
  <!-- 左侧面基石 -->
  <path class="xc-left" d="M10 35 L50 55 L50 90 L10 70 Z"></path>
  <!-- 顶部平台 (璇玉) -->
  <path class="xc-top" d="M50 15 L90 35 L50 55 L10 35 Z"></path>
  <!-- 顶部精密纹路 (MCP枢纽) -->
  <path class="xc-accent" d="M50 25 L70 35 L50 45 L30 35 Z"></path>
  <circle class="xc-accent" cx="50" cy="35" r="5"></circle>
</svg>